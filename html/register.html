<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録 | HAL CINEMA</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/chatbot.css">
  <link rel="stylesheet" href="../css/mypage.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">HAL <span>CINEMA</span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">上映スケジュール</a>
        <a href="movies.html">作品一覧</a>
        <a href="goods.html">グッズ・物販</a>
        <a href="event.html">イベント情報</a>
        <a href="theater.html">劇場情報</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">ログイン</a>
        <a href="register.html" class="btn btn-secondary btn-sm active">会員登録</a>
        <a href="mypage.html" class="mypage-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          マイページ
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="auth-page">
    <div class="auth-card">

      <!-- ロゴ -->
      <p class="auth-logo">HAL <span>CINEMA</span></p>
      <p class="auth-tagline">NEW MEMBER</p>

      <h1 class="auth-title">会員登録</h1>
      <p class="auth-subtitle">アカウントを作成してご利用ください</p>

      <form class="auth-form" action="#" method="post">

        <!-- お名前 -->
        <div class="form-group">
          <label class="form-label" for="name">お名前</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input class="form-input" type="text" id="name" name="name"
              placeholder="山田 太郎" autocomplete="name" required>
          </div>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="form-input" type="email" id="email" name="email"
              placeholder="example@email.com" autocomplete="email" required>
          </div>
        </div>

        <!-- パスワード -->
        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="form-input" type="password" id="password" name="password"
              placeholder="8文字以上で入力" autocomplete="new-password" required>
            <button type="button" class="input-toggle" id="toggle-password" aria-label="パスワードを表示">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- パスワード確認 -->
        <div class="form-group">
          <label class="form-label" for="password-confirm">パスワード（確認）</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="form-input" type="password" id="password-confirm" name="password-confirm"
              placeholder="もう一度入力してください" autocomplete="new-password" required>
            <button type="button" class="input-toggle" id="toggle-confirm" aria-label="パスワードを表示">
              <svg id="eye-icon-confirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p id="password-error" style="display:none; font-size:12px; color:var(--c-red); margin-top:6px;">
            パスワードが一致しません
          </p>
        </div>

        <!-- 利用規約 -->
        <div class="auth-check-row" style="margin-bottom: 24px;">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">
            <a href="#">利用規約</a>および<a href="#">個人情報保護方針</a>に同意します
          </label>
        </div>

        <!-- 登録ボタン -->
        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
          アカウントを作成する
        </button>

      </form>

      <div class="auth-divider"><span>または</span></div>

      <!-- ログインリンク -->
      <p class="auth-switch">
        すでにアカウントをお持ちの方は
        <a href="login.html">ログインはこちら</a>
      </p>

    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">HAL <span>CINEMA</span></p>
        <p class="footer-desc">
          HALシネマは全8スクリーン・1,500席を誇る<br>
          名古屋最大級のシネマコンプレックスです。
        </p>
      </div>
      <nav class="footer-links">
        <a href="index.html">トップ</a>
        <a href="#">お問い合わせ</a>
        <a href="#">Q&amp;A</a>
        <a href="#">個人情報保護方針</a>
      </nav>
      <p class="footer-copy">© 2026 HAL CINEMA. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js" defer></script>
  <script src="../js/chatbot.js" defer></script>
  <script>
    // パスワード表示トグル（パスワード欄）
    document.getElementById('toggle-password').addEventListener('click', function () {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>`;
      }
    });

    // パスワード表示トグル（確認欄）
    document.getElementById('toggle-confirm').addEventListener('click', function () {
      const input = document.getElementById('password-confirm');
      const icon  = document.getElementById('eye-icon-confirm');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>`;
      }
    });

    // パスワード一致チェック
    document.getElementById('password-confirm').addEventListener('input', function () {
      const pw    = document.getElementById('password').value;
      const err   = document.getElementById('password-error');
      err.style.display = (this.value && this.value !== pw) ? 'block' : 'none';
    });

    const API_BASE = 'http://localhost:8080';

    // フォーム送信時の一致チェック + API登録
    document.querySelector('.auth-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const pw   = document.getElementById('password').value;
      const conf = document.getElementById('password-confirm').value;
      if (pw !== conf) {
        document.getElementById('password-error').style.display = 'block';
        document.getElementById('password-confirm').focus();
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.disabled = true;

      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      try {
        const res = await fetch(API_BASE + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password: pw })
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = data.error === 'email already registered'
            ? 'このメールアドレスは既に登録されています'
            : '登録に失敗しました: ' + data.error;
          alert(msg);
          if (submitBtn) submitBtn.disabled = false;
          return;
        }

        localStorage.setItem('hal_token',  data.token);
        localStorage.setItem('hal_member', JSON.stringify(data.member));
        alert('会員登録が完了しました！');
        location.href = 'mypage.html';

      } catch (err) {
        alert('サーバーに接続できませんでした。APIが起動しているか確認してください。');
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
