<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧 | HAL CINEMA</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/chatbot.css">
  <link rel="stylesheet" href="../css/mypage.css">
  <link rel="stylesheet" href="../css/movies.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">HAL <span>CINEMA</span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">上映スケジュール</a>
        <a href="movies.html" class="active">作品一覧</a>
        <a href="goods.html">グッズ・物販</a>
        <a href="event.html">イベント情報</a>
        <a href="theater.html">劇場情報</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">ログイン</a>
        <a href="register.html" class="btn btn-secondary btn-sm">会員登録</a>
        <a href="mypage.html" class="mypage-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          マイページ
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="page-main">

    <nav class="breadcrumb" aria-label="パンくず">
      <a href="index.html">TOP</a>
      <span class="breadcrumb-sep"></span>
      <span>作品一覧</span>
    </nav>

    <h1 class="page-title">作品<span>一覧</span></h1>

    <!-- フィルタータブ -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="now">上映中</button>
      <button class="filter-tab" data-filter="coming">上映予定</button>
    </div>

    <!-- 映画グリッド -->
    <div class="movies-grid" id="movies-grid"></div><!-- /movies-grid -->

  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">HAL <span>CINEMA</span></p>
        <p class="footer-desc">
          HALシネマは全8スクリーン・1,500席を誇る<br>
          名古屋最大級のシネマコンプレックスです。
        </p>
      </div>
      <nav class="footer-links">
        <a href="index.html">トップ</a>
        <a href="#">お問い合わせ</a>
        <a href="#">Q&amp;A</a>
        <a href="#">個人情報保護方針</a>
      </nav>
      <p class="footer-copy">© 2026 HAL CINEMA. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js" defer></script>
  <script src="../js/chatbot.js" defer></script>
  <script>
    var API_BASE   = 'http://localhost:8080'
    const POSTER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>'
    const POSTER_PH = POSTER_SVG + '<span class="movie-poster-ph-label">POSTER</span>'

    function onPosterError(img) {
      img.closest('.movie-poster-ph').innerHTML = POSTER_PH
    }

    function comingDateLabel(iso) {
      var d = new Date(iso)
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月公開予定'
    }

    function buildGridItem(m) {
      var isNow    = m.isShowing === 1
      var status   = isNow ? 'now' : 'coming'
      var year     = new Date(m.releaseDate).getFullYear()
      var badge    = isNow ? '<span class="badge badge-red movie-card-badge">上映中</span>' : '<span class="badge badge-dark movie-card-badge">公開予定</span>'
      var btn      = isNow
        ? '<a href="movie-detail.html?id=' + m.movieId + '" class="btn btn-primary btn-sm">詳細・予約</a>'
        : '<a href="movie-detail.html?id=' + m.movieId + '" class="btn btn-secondary btn-sm">詳細を見る</a>'
      var meta     = isNow ? year + ' · ' + m.duration + '分' : comingDateLabel(m.releaseDate)
      return '<div class="movie-grid-item card movie-card" data-status="' + status + '">'
        + '<div class="movie-poster-ph">' + POSTER_SVG + '<span class="movie-poster-ph-label">POSTER</span></div>'
        + badge
        + '<div class="movie-card-overlay">'
        + '<p class="movie-card-title">' + m.title + '</p>'
        + '<p class="text-sm text-sub">' + meta + '</p>'
        + btn
        + '</div>'
        + '<div class="movie-card-info">'
        + '<p class="movie-card-info-title">' + m.title + '</p>'
        + '<p class="movie-card-info-meta">' + meta + '</p>'
        + '</div></div>'
    }

    var currentFilter = 'now'

    function applyFilter() {
      document.querySelectorAll('.movie-grid-item').forEach(function(item) {
        item.dataset.hidden = (item.dataset.status !== currentFilter) ? 'true' : 'false'
      })
    }

    fetch(API_BASE + '/api/movies')
      .then(function(r) { return r.json() })
      .then(function(movies) {
        document.getElementById('movies-grid').innerHTML = movies.map(buildGridItem).join('')
        applyFilter()

        document.querySelectorAll('.filter-tab').forEach(function(tab) {
          tab.addEventListener('click', function() {
            document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active') })
            tab.classList.add('active')
            currentFilter = tab.dataset.filter
            applyFilter()
          })
        })
      })
      .catch(function() {
        document.getElementById('movies-grid').innerHTML =
          '<p style="padding:2rem;text-align:center;color:var(--text-muted)">作品情報の取得に失敗しました。</p>'
      })
  </script>

</body>
</html>
