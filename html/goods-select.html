<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グッズ・売店 | HAL CINEMA</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/chatbot.css">
  <link rel="stylesheet" href="../css/mypage.css">
  <link rel="stylesheet" href="../css/goods.css">
  <link rel="stylesheet" href="../css/goods-select.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">HAL <span>CINEMA</span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">上映スケジュール</a>
        <a href="movies.html">作品一覧</a>
        <a href="goods.html">グッズ・物販</a>
        <a href="event.html">イベント情報</a>
        <a href="theater.html">劇場情報</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">ログイン</a>
        <a href="register.html" class="btn btn-secondary btn-sm">会員登録</a>
        <a href="mypage.html" class="mypage-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          マイページ
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">

    <!-- ステップバー -->
    <div class="gs-steps">
      <div class="gs-step done">
        <span class="gs-step-num">1</span>
        <span>座席選択</span>
      </div>
      <div class="gs-step-line done"></div>
      <div class="gs-step active">
        <span class="gs-step-num">2</span>
        <span>グッズ選択</span>
      </div>
      <div class="gs-step-line"></div>
      <div class="gs-step">
        <span class="gs-step-num">3</span>
        <span>決済</span>
      </div>
      <div class="gs-step-line"></div>
      <div class="gs-step">
        <span class="gs-step-num">4</span>
        <span>チケット発行</span>
      </div>
    </div>

    <!-- 予約情報バー -->
    <div class="gs-booking-bar" id="gs-booking-bar"></div>

    <!-- メインレイアウト -->
    <div class="goods-layout">

      <!-- サイドバー -->
      <aside class="goods-sidebar">

        <div class="sidebar-section">
          <p class="sidebar-section-label">カテゴリ</p>
          <div class="sidebar-category">
            <button class="category-btn active" data-cat="goods">グッズ</button>
            <button class="category-btn" data-cat="shop">売店</button>
          </div>
        </div>

        <div class="sidebar-section">
          <p class="sidebar-section-label">検索</p>
          <input type="text" id="searchInput" class="sidebar-search" placeholder="キーワードで探す…">
        </div>

        <div class="sidebar-section">
          <p class="sidebar-section-label">絞り込み</p>
          <div class="sidebar-filters">
            <div class="filter-group" id="size-filter-group">
              <label for="sizeFilter">サイズ</label>
              <select id="sizeFilter">
                <option value="all">すべて</option>
                <option value="A3">A3</option>
                <option value="A4">A4</option>
                <option value="M">M</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="sortPrice">価格</label>
              <select id="sortPrice">
                <option value="none">指定なし</option>
                <option value="asc">安い順</option>
                <option value="desc">高い順</option>
              </select>
            </div>
          </div>
        </div>

        <!-- カート -->
        <div class="sidebar-section gs-cart-section">
          <p class="sidebar-section-label">カート</p>
          <div class="gs-cart-items-wrap">
            <div id="cart-items-list">
              <p class="gs-cart-empty">商品が選択されていません</p>
            </div>
          </div>
          <div id="gs-cart-totals" style="display:none;"></div>
        </div>

        <!-- アクションボタン -->
        <div class="gs-actions">
          <button class="btn btn-primary" id="proceed-btn">決済へ進む</button>
          <button class="btn btn-ghost btn-sm" id="skip-btn">スキップして決済へ</button>
        </div>

      </aside>

      <!-- メインコンテンツ -->
      <div class="goods-main">
        <div class="goods-main-header">
          <h2 id="category-title" class="goods-category-title">グッズ <span>GOODS</span></h2>
          <span id="item-count" class="goods-item-count"></span>
        </div>
        <div class="goods-grid" id="goods-grid"></div>
      </div>

    </div>

  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">HAL <span>CINEMA</span></p>
        <p class="footer-desc">
          HALシネマは全8スクリーン・1,500席を誇る<br>
          名古屋最大級のシネマコンプレックスです。
        </p>
      </div>
      <nav class="footer-links">
        <a href="index.html">トップ</a>
        <a href="#">お問い合わせ</a>
        <a href="#">Q&amp;A</a>
        <a href="#">個人情報保護方針</a>
      </nav>
      <p class="footer-copy">© 2026 HAL CINEMA. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js" defer></script>
  <script src="../js/chatbot.js" defer></script>
  <script src="../js/goods-select.js" defer></script>

</body>
</html>
