<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャットボット | HAL CINEMA</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<!-- data-no-widget="true" でポップアップウィジェットの自動挿入を抑止 -->
<body data-no-widget="true">

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">HAL <span>CINEMA</span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">上映スケジュール</a>
        <a href="movies.html">作品一覧</a>
        <a href="goods.html">グッズ・物販</a>
        <a href="event.html">イベント情報</a>
        <a href="theater.html">劇場情報</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">ログイン</a>
        <a href="register.html" class="btn btn-secondary btn-sm">会員登録</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- フルページ チャット -->
  <main>
    <div class="chatbot-page">

      <!-- チャットヘッダー -->
      <div class="chatbot-header">
        <div class="chatbot-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="12" rx="3"/>
            <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
            <circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/>
            <path d="M9 18h6"/>
            <path d="M12 3v1"/>
          </svg>
        </div>
        <div class="chatbot-header-info">
          <p class="chatbot-name">HAL アシスタント</p>
          <p class="chatbot-status">● オンライン</p>
        </div>
        <button class="chatbot-voice-toggle" id="voice-toggle-full" title="自動読み上げのON/OFF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <span id="voice-label-full">音声 OFF</span>
        </button>
      </div>

      <!-- メッセージ一覧 -->
      <div class="chat-messages" id="chat-messages-full">

        <!-- 初期メッセージ -->
        <div class="chat-msg bot">
          <div class="msg-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="8" width="18" height="12" rx="3"/>
              <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
              <circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/>
              <path d="M9 18h6"/>
            </svg>
          </div>
          <div>
            <div class="msg-bubble">
              こんにちは！HALシネマのアシスタントです。<br>
              上映スケジュール・予約・劇場案内など、なんでもお気軽にご質問ください。
            </div>
            <div class="msg-footer">
              <span class="msg-time">--:--</span>
              <button class="speak-btn" data-text="こんにちは！HALシネマのアシスタントです。上映スケジュール・予約・劇場案内など、なんでもお気軽にご質問ください。">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <span class="speak-label">読み上げ</span>
                <span class="wave-bars" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                </span>
              </button>
            </div>
          </div>
        </div>

        <!-- クイックリプライ -->
        <div class="quick-replies" id="quick-replies-full">
          <button class="quick-reply-btn">今日の上映スケジュール</button>
          <button class="quick-reply-btn">座席の予約方法</button>
          <button class="quick-reply-btn">料金について</button>
          <button class="quick-reply-btn">劇場へのアクセス</button>
        </div>

      </div>

      <!-- 入力エリア -->
      <div class="chat-input-area">
        <div class="chat-input-wrap">
          <textarea
            class="chat-input"
            id="chat-input-full"
            placeholder="メッセージを入力…"
            rows="1"
          ></textarea>
          <button class="chat-send-btn" id="send-btn-full">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="chat-input-hint">Enter で送信 / Shift+Enter で改行</p>
      </div>

    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">HAL <span>CINEMA</span></p>
        <p class="footer-desc">名古屋最大級のシネマコンプレックス。全8スクリーン・1,500席。</p>
      </div>
      <nav class="footer-links">
        <a href="#">トップ</a>
        <a href="#">お問い合わせ</a>
        <a href="#">Q&amp;A</a>
        <a href="#">個人情報保護方針</a>
      </nav>
      <p class="footer-copy">© 2026 HAL CINEMA. All rights reserved.</p>
    </div>
  </footer>

  <!-- JS：インラインJSなし・外部ファイルのみ -->
  <script src="../js/common.js" defer></script>
  <script src="../js/chatbot.js" defer></script>

</body>
</html>
