<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/chatbot.css">
  <link rel="stylesheet" href="../css/mypage.css">
  <link rel="stylesheet" href="../css/movies.css">
</head>
<body>

  <!-- ヘッダー -->

      <a href="index.html" class="site-logo">HAL <span>CINEMA</span></a>

        <a href="movies.html" class="active">作品一覧</a>
        <a href="goods.html">グッズ・物販</a>
        <a href="event.html">イベント情報</a>
        <a href="theater.html">劇場情報</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">ログイン</a>
        <a href="register.html" class="btn btn-secondary btn-sm">会員登録</a>
        <a href="mypage.html" class="mypage-nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          マイページ
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="page-main">

    <nav class="breadcrumb" aria-label="パンくず">
      <a href="index.html">TOP</a>
      <span class="breadcrumb-sep"></span>
      <a href="movies.html">作品一覧</a>
      <span class="breadcrumb-sep"></span>
      <span>作品詳細</span>
    </nav>

    <h1 class="page-title">作品<span>詳細</span></h1>

    <div id="detail-content">
      <p style="padding:2rem;text-align:center;color:var(--text-muted)">読み込み中...</p>
    </div>

  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <p class="footer-logo">HAL <span>CINEMA</span></p>
        <p class="footer-desc">
          HALシネマは全8スクリーン・1,500席を誇る<br>
          名古屋最大級のシネマコンプレックスです。
        </p>
      </div>
      <nav class="footer-links">
        <a href="index.html">トップ</a>
        <a href="#">お問い合わせ</a>
        <a href="#">Q&amp;A</a>
        <a href="#">個人情報保護方針</a>
      </nav>
      <p class="footer-copy">© 2026 HAL CINEMA. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/common.js" defer></script>
  <script src="../js/chatbot.js" defer></script>
  <script>
    var DETAIL_POSTER_PH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg><span>ポスタービジュアル</span>'

    function onDetailPosterError(img) {
      img.closest('.movie-detail-poster').innerHTML = DETAIL_POSTER_PH
    }

    var API_BASE = 'http://localhost:8080'
    var DAY_JA = ['日','月','火','水','木','金','土']
    var today  = new Date()
    var TOTAL = 14, VISIBLE = 7
    var dateOffset = 0, selectedIdx = 0
    var currentMovie = null
    var selectedSlot = null
    var allSchedules = []   // /api/schedules?movieId= の結果全件（14日分）

    function pad2(n) { return n < 10 ? '0' + n : '' + n }

    function dateAt(idx) {
      var d = new Date(today)
      d.setDate(today.getDate() + idx)
      return d
    }
    function isoDate(d) {
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
    }
    function formatReleaseDate(iso) {
      var d = new Date(iso)
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'
    }

    // ── 日付タブ生成 ──────────────────────────────────────────
    function buildDates() {
      var tabsEl  = document.getElementById('date-tabs')
      var prevBtn = document.getElementById('date-prev')
      var nextBtn = document.getElementById('date-next')
      if (!tabsEl) return
      tabsEl.innerHTML = ''
      for (var i = dateOffset; i < Math.min(dateOffset + VISIBLE, TOTAL); i++) {
        var d   = dateAt(i)
        var tab = document.createElement('button')
        tab.className = 'schedule-date-tab' + (i === selectedIdx ? ' active' : '')
        tab.dataset.idx = i
        tab.dataset.date = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate()
        tab.innerHTML = '<span class="schedule-date-num">' + (d.getMonth()+1) + '/' + d.getDate() + '</span>'
          + '<span class="schedule-date-day">（' + DAY_JA[d.getDay()] + '）</span>'
        tab.addEventListener('click', function() {
          selectedIdx = parseInt(this.dataset.idx)
          selectedSlot = null
          buildDates()
          refreshScheduleContent()
        })
        tabsEl.appendChild(tab)
      }
      prevBtn.disabled = (dateOffset === 0)
      nextBtn.disabled = (dateOffset + VISIBLE >= TOTAL)
      prevBtn.style.opacity = prevBtn.disabled ? '0.3' : '1'
      nextBtn.style.opacity = nextBtn.disabled ? '0.3' : '1'
    }

    // ── スケジュール描画（選択中の日付分のみ）──────────────────
    function buildSchedule(movie) {
      var activeDate = isoDate(dateAt(selectedIdx))
      var todays = allSchedules
        .filter(function(s) { return s.showDate === activeDate })
        .sort(function(a, b) { return a.startTime.localeCompare(b.startTime) })

      if (todays.length === 0) {
        return '<p style="padding:24px 0;text-align:center;color:var(--text-muted)">この日の上映予定はありません</p>'
      }

      var html = '<div class="schedule-movie-row">'
        + '<div class="schedule-movie-header">' + movie.title + '</div>'
        + '<div class="schedule-times-wrap">'

      todays.forEach(function(s) {
        var start = s.startTime.slice(0, 5)
        var endD  = new Date(2000, 0, 1, parseInt(s.startTime.slice(0,2), 10), parseInt(s.startTime.slice(3,5), 10))
        endD.setMinutes(endD.getMinutes() + (movie.duration || 120))
        var end = pad2(endD.getHours()) + ':' + pad2(endD.getMinutes())
        var full = s.status !== 0 || s.availableSeats <= 0

        if (full) {
          html += '<div class="time-slot full">'
            + '<span class="time-slot-time">' + start + '</span>'
            + '<span class="time-slot-end">〜 ' + end + '</span>'
            + '<span class="time-slot-screen">満席</span></div>'
        } else {
          html += '<button class="time-slot" data-schedule-id="' + s.scheduleId + '" data-movie="' + movie.title
            + '" data-screen="' + s.screenName + '" data-screen-type="' + s.screenType
            + '" data-time="' + start + '" data-endtime="' + end + '">'
            + '<span class="time-slot-time">' + start + '</span>'
            + '<span class="time-slot-end">〜 ' + end + '</span>'
            + '<span class="time-slot-screen">' + s.screenName + '（残り' + s.availableSeats + '席）</span></button>'
        }
      })

      html += '</div></div>'
      return html
    }

    function refreshScheduleContent() {
      var contentEl = document.getElementById('schedule-content')
      if (!contentEl) return
      contentEl.innerHTML = buildSchedule(currentMovie)
      attachSlotHandlers()
    }

    // ── 時間スロットのクリック処理 ────────────────────────────
    function attachSlotHandlers() {
      document.querySelectorAll('button.time-slot').forEach(function(slot) {
        slot.addEventListener('click', function() {
          if (this.classList.contains('selected')) {
            this.classList.remove('selected')
            selectedSlot = null
          } else {
            document.querySelectorAll('button.time-slot.selected').forEach(function(s) {
              s.classList.remove('selected')
            })
            this.classList.add('selected')
            selectedSlot = this
          }
        })
      })
    }

    // ── 詳細ページ描画 ───────────────────────────────────────
    function renderDetail(movie) {
      var hasSchedule  = movie.isShowing === 1
      var statusBadge  = hasSchedule ? '<span class="badge badge-red">上映中</span>' : '<span class="badge badge-dark">公開予定</span>'
      var formatBadges = (movie.formats || []).map(function(f) { return '<span class="badge badge-border">' + f + '</span>' }).join('')
      var scheduleSection = hasSchedule ? (
        '<section class="section" id="schedule">'
        + '<div class="section-header"><h2 class="section-title">映画上映<span>スケジュール</span></h2></div>'
        + '<div class="schedule-inner">'
        + '<div class="schedule-nav">'
        + '<button class="schedule-nav-btn" id="date-prev">&#8249;</button>'
        + '<div class="schedule-date-tabs" id="date-tabs"></div>'
        + '<button class="schedule-nav-btn" id="date-next">&#8250;</button>'
        + '</div>'
        + '<div id="schedule-content"></div>'
        + '<div class="schedule-reserve-wrap"><button id="reserve-btn" class="btn btn-primary btn-lg">予約する</button></div>'
        + '</div></section>'
      ) : ''

      document.getElementById('detail-content').innerHTML =
        '<section class="section">'
        + '<div class="movie-detail-grid">'
        + '<div><div class="movie-detail-poster">'
        + '<img src="../images/poster/' + movie.id + '.jpg" alt="' + movie.title + '" onerror="onDetailPosterError(this)">'
        + '</div></div>'
        + '<div class="movie-detail-info">'
        + '<div class="movie-detail-badges">' + statusBadge + formatBadges + '</div>'
        + '<div><h2 class="movie-detail-title">' + movie.title + '</h2>'
        + '<p class="movie-detail-title-sub">' + (movie.titleEn || '') + '</p></div>'
        + '<p class="movie-detail-desc">' + (movie.synopsis || '') + '</p>'
        + '<table class="movie-meta-table">'
        + '<tr><th>公開日</th><td>' + formatReleaseDate(movie.releaseDate) + '</td></tr>'
        + '<tr><th>上映時間</th><td>' + (movie.duration ? movie.duration + '分' : '未定') + '</td></tr>'
        + '<tr><th>監督</th><td>' + (movie.director || '未定') + '</td></tr>'
        + '<tr><th>出演</th><td>' + (movie.cast || '未定') + '</td></tr>'
        + '<tr><th>ジャンル</th><td>' + movie.genre + '</td></tr>'
        + '<tr><th>レーティング</th><td>' + movie.rating + '</td></tr>'
        + '</table>'
        + '<div class="movie-detail-actions">'
        + (hasSchedule ? '<a href="#schedule" class="btn btn-primary btn-lg">上映スケジュールへ</a>' : '')
        + '<a href="#" class="btn btn-secondary btn-lg">お気に入りに追加</a>'
        + '</div></div></div></section>'
        + '<section class="section"><div class="section-header"><h2 class="section-title">予告編<span>動画</span></h2></div>'
        + (movie.trailerId
            ? '<div class="trailer-box playing"><iframe src="https://www.youtube.com/embed/' + movie.trailerId + '" frameborder="0" allow="fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0;display:block;"></iframe></div>'
            : '<div class="trailer-box trailer-box--unavailable"><span class="trailer-unavailable-label">予告編 準備中</span></div>'
              + '<p class="trailer-label">予告編は公開次第掲載します</p>')
        + '</section>'
        + scheduleSection

      document.getElementById('trailer-box').addEventListener('click', function() {
        alert('予告編動画を再生します')
      })

      if (hasSchedule) {
        buildDates()
        refreshScheduleContent()
        document.getElementById('date-prev').addEventListener('click', function() {
          if (dateOffset > 0) { dateOffset = Math.max(0, dateOffset - VISIBLE); buildDates() }
        })
        document.getElementById('date-next').addEventListener('click', function() {
          if (dateOffset + VISIBLE < TOTAL) { dateOffset = Math.min(TOTAL - VISIBLE, dateOffset + VISIBLE); buildDates() }
        })
        document.getElementById('reserve-btn').addEventListener('click', function() {
          if (!selectedSlot) {
            alert('時間帯を選択してください')
            return
          }
          var activeTab = document.querySelector('.schedule-date-tab.active')
          var date = activeTab ? activeTab.dataset.date : ''
          var params = new URLSearchParams({
            scheduleId: selectedSlot.dataset.scheduleId,
            movie:      selectedSlot.dataset.movie,
            screen:     selectedSlot.dataset.screen,
            time:       selectedSlot.dataset.time,
            endtime:    selectedSlot.dataset.endtime,
            date:       date,
            screenType: selectedSlot.dataset.screenType
          })
          location.href = 'zaseki.html?' + params.toString()
        })
      }

      document.title = movie.title + ' | HAL CINEMA'
    }

    // ── fetch ────────────────────────────────────────────────
    var movieId = new URLSearchParams(location.search).get('id')

    fetch(API_BASE + '/api/movies/' + movieId)
      .then(function(r) { if (!r.ok) throw new Error('movie not found'); return r.json() })
      .then(function(movie) {
        currentMovie = movie
        if (movie.isShowing === 1) {
          return fetch(API_BASE + '/api/schedules?movieId=' + movie.movieId)
            .then(function(r) { return r.ok ? r.json() : [] })
            .then(function(scheds) {
              allSchedules = Array.isArray(scheds) ? scheds : []
              renderDetail(movie)
            })
        }
        renderDetail(movie)
      })
      .catch(function() {
        document.getElementById('detail-content').innerHTML =
          '<p style="padding:2rem;text-align:center;color:var(--text-muted)">作品情報の取得に失敗しました。</p>'
      })
  </script>

</body>
</html>
