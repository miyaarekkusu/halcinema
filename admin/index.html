<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード | HAL CINEMA 管理者画面</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard">

<div class="admin-screen">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <span class="sidebar__brand">HAL CINEMA</span>
      <span class="sidebar__sub">管理者画面</span>
    </div>
    <nav class="sidebar__nav">
      <p class="sidebar__section-label">概要</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="dashboard" href="index.html">ダッシュボード</a></li>
      </ul>
      <p class="sidebar__section-label">編成</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="movies" href="movies.html">作品・配給</a></li>
        <li><a class="sidebar__item" data-page="schedule" href="schedule.html">枠割り当て</a></li>
      </ul>
      <p class="sidebar__section-label">経理</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="sales" href="sales.html">売上・精算</a></li>
      </ul>
      <p class="sidebar__section-label">運営</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="backyard" href="backyard.html">バックヤード</a></li>
      </ul>
      <p class="sidebar__section-label">現場</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="gate" href="gate.html">入場ゲート</a></li>
        <li><a class="sidebar__item" data-page="food" href="food.html">フード</a></li>
        <li><a class="sidebar__item" data-page="goods" href="goods.html">グッズ</a></li>
      </ul>
      <p class="sidebar__section-label">システム</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="settings" href="settings.html">設定</a></li>
      </ul>
    </nav>
  </aside>

  <div class="main-col">

    <header class="topbar">
      <div class="topbar__left">
        <button class="topbar__menu-btn" id="sidebar-toggle" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
        <nav class="topbar__breadcrumb">
          <span class="topbar__breadcrumb-root">管理者画面</span>
          <span class="topbar__breadcrumb-sep">›</span>
          <span class="topbar__breadcrumb-current">ダッシュボード</span>
        </nav>
      </div>
      <div class="topbar__right">
        <span class="topbar__user" id="topbar-user">admin</span>
        <button class="topbar__logout" id="logout-btn">ログアウト</button>
      </div>
    </header>

    <main class="page-content">
      <section class="page-section">
        <div class="page-head">
          <div>
            <h1 class="page-title">ダッシュボード</h1>
            <p class="page-desc">今日の売上・上映・注意が必要なことをひと目で確認します。</p>
          </div>
          <div class="toolbar" style="margin-bottom:0">
            <button class="toolbar__btn toolbar__btn--sm" id="dash-prev" aria-label="前の日">◀</button>
            <input class="toolbar__search" style="min-width:0" type="date" id="dash-date">
            <button class="toolbar__btn toolbar__btn--sm" id="dash-next" aria-label="次の日">▶</button>
            <button class="toolbar__btn toolbar__btn--sm" id="dash-today">今日</button>
          </div>
        </div>

        <div class="stat-grid" id="dash-stats"></div>

        <div class="dash-grid">
          <div class="panel">
            <div class="panel__head"><span>アラート</span><span class="panel__count" id="dash-alert-count"></span></div>
            <ul class="alert-list" id="dash-alerts"></ul>
          </div>
          <div class="panel">
            <div class="panel__head"><span>本日の締め</span></div>
            <div id="dash-closing"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel__head"><span id="dash-shows-title">本日の上映</span><span class="panel__count" id="dash-now"></span></div>
          <div class="table-wrap">
            <table class="admin-table">
              <thead><tr><th>時刻</th><th>スクリーン</th><th>作品</th><th>販売</th><th>状態</th><th>清掃</th></tr></thead>
              <tbody id="dash-shows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="admin-common.js" defer></script>
<script src="admin-office.js" defer></script>
<script src="admin-data.js" defer></script>
<script src="admin-model.js" defer></script>
<script src="dashboard.js" defer></script>
</body>
</html>
