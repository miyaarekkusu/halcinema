<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード | HAL CINEMA 管理者画面</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard">

<div class="admin-screen">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <span class="sidebar__brand">HAL CINEMA</span>
      <span class="sidebar__sub">管理者画面</span>
    </div>
    <nav class="sidebar__nav">
      <p class="sidebar__section-label">概要</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="dashboard" href="index.html">ダッシュボード</a></li>
      </ul>
      <p class="sidebar__section-label">端末切り替え</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="ticket" href="ticket.html">発券</a></li>
        <li><a class="sidebar__item" data-page="food" href="food.html">フード</a></li>
        <li><a class="sidebar__item" data-page="goods" href="goods.html">グッズ</a></li>
        <li><a class="sidebar__item" data-page="gate" href="gate.html">入場ゲート</a></li>
        <li><a class="sidebar__item" data-page="backyard" href="backyard.html">バックヤード</a></li>
      </ul>
      <p class="sidebar__section-label">システム</p>
      <ul class="sidebar__list">
        <li><a class="sidebar__item" data-page="settings" href="settings.html">設定</a></li>
        <li><a class="sidebar__item" data-page="logs" href="logs.html">ログ</a></li>
      </ul>
    </nav>
  </aside>

  <div class="main-col">

    <header class="topbar">
      <div class="topbar__left">
        <button class="topbar__menu-btn" id="sidebar-toggle" aria-label="メニュー">
          <span></span><span></span><span></span>
        </button>
        <nav class="topbar__breadcrumb">
          <span class="topbar__breadcrumb-root">管理者画面</span>
          <span class="topbar__breadcrumb-sep">›</span>
          <span class="topbar__breadcrumb-current">ダッシュボード</span>
        </nav>
      </div>
      <div class="topbar__right">
        <span class="topbar__user" id="topbar-user">admin</span>
        <button class="topbar__logout" id="logout-btn">ログアウト</button>
      </div>
    </header>

    <main class="page-content">
      <section class="page-section">
        <h1 class="page-title">ダッシュボード</h1>

        <div class="stat-grid">
          <div class="stat-card"><div class="stat-card__body"><span class="stat-card__label">本日の予約数</span><span class="stat-card__value">—</span></div></div>
          <div class="stat-card"><div class="stat-card__body"><span class="stat-card__label">フード売上</span><span class="stat-card__value">—</span></div></div>
          <div class="stat-card"><div class="stat-card__body"><span class="stat-card__label">グッズ売上</span><span class="stat-card__value">—</span></div></div>
          <div class="stat-card"><div class="stat-card__body"><span class="stat-card__label">入場者数</span><span class="stat-card__value">—</span></div></div>
        </div>

        <div class="placeholder-box"><p>集計データはサーバー接続後に表示されます。左のメニューから各機能を選択してください。</p></div>
      </section>
    </main>
  </div>
</div>

<script src="admin-common.js" defer></script>
</body>
</html>
